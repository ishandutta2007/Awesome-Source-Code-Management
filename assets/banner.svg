<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
      .code-pulse { stroke-dasharray: 8 8; animation: dash 30s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -1000; } }
      
      .node-pulse { animation: pulse 3s ease-in-out infinite alternate; }
      @keyframes pulse { 0% { r: 6px; opacity: 0.7; } 100% { r: 10px; opacity: 1; } }

      .float-pill { animation: float 6s ease-in-out infinite alternate; }
      @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Grid & Lines -->
  <g class="code-pulse">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" class="grid-line"/>
    <path d="M 100,0 L 100,300 M 300,0 L 300,300 M 500,0 L 500,300 M 700,0 L 700,300 M 900,0 L 900,300 M 1100,0 L 1100,300" class="grid-line"/>
  </g>

  <!-- Animated Git Flow Lines in Background -->
  <path d="M 50,220 Q 200,280 400,220 T 800,250 T 1150,200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="code-pulse"/>
  <path d="M 50,80 Q 300,20 600,70 T 1150,50" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" class="code-pulse"/>

  <!-- Background Animated Nodes -->
  <circle cx="200" cy="243" r="8" fill="#38bdf8" class="node-pulse" opacity="0.5"/>
  <circle cx="600" cy="70" r="8" fill="#c084fc" class="node-pulse" opacity="0.5"/>
  <circle cx="800" cy="250" r="8" fill="#818cf8" class="node-pulse" opacity="0.5"/>

  <!-- Subtle Floating Decorative Pills (Placed behind foreground text) -->
  <g class="float-pill" opacity="0.4">
    <rect x="80" y="40" width="120" height="30" rx="15" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="140" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Git / VCS</text>
  </g>

  <g class="float-pill" opacity="0.4" style="animation-delay: -3s;">
    <rect x="1000" y="220" width="130" height="30" rx="15" fill="url(#card-grad)" stroke="rgba(192, 132, 252, 0.3)"/>
    <text x="1065" y="240" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DevOps &amp; CI/CD</text>
  </g>

  <!-- FOREGROUND CONTENT (Ensured clear, high-contrast, visible text) -->
  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="url(#text-grad)" filter="url(#glow)">
    Awesome Source Code Management
  </text>
  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="url(#text-grad)">
    Awesome Source Code Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
    Curated SaaS Platforms, Enterprise VCS &amp; Open-Source Repositories
  </text>

  <!-- Feature Badges Row (Foreground) -->
  <g transform="translate(360, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Git &amp; Forges</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="170" height="32" rx="16" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
    <text x="240" y="20" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 SaaS &amp; Self-Hosted</text>

    <!-- Pill 3 -->
    <rect x="340" y="0" width="140" height="32" rx="16" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1"/>
    <text x="410" y="20" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Code Review</text>
  </g>
</svg>
